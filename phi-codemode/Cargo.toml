[package]
name = "phi-codemode"
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
description = "Isolated JavaScript tool orchestration with QuickJS and Wasmtime"
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1"
futures = "0.3"
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
wasmtime = { version = "=50.0.0", default-features = false, features = ["std", "runtime", "cranelift", "anyhow", "parallel-compilation", "cache"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[[bench]]
name = "runtime"
harness = false

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
sha2 = "0.11"
tempfile = "3"
