[package]
name = "phi-sdk"
version = "0.0.1"
edition = "2024"
license = "MIT"

[dependencies]
notify = "8"
phi-codemode = { path = "../phi-codemode" }
tokio-util = { version = "0.7", features = ["rt"] }
rig = { version = "0.42.0", default-features = false, features = ["agent", "reqwest", "rustls"] }
rmcp = { version = "3.1", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
base64 = "0.23"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "process", "fs", "io-util"] }
anyhow = "1"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
futures = "0.3"
reqwest = "0.13"
bytes = "1"
dirs = "7"
compact_str = { version = "0.10", features = ["serde"] }
smallvec = "1"
similar = "3"
regex = "1"
shlex = "2"
tree-sitter = "0.27"
tree-sitter-bash = "0.25"
tree-sitter-javascript = "0.25"
bm25 = "2.3"
jieba-rs = { version = "0.11", default-features = true }
libc = "0.2"
ignore = "0.4"
http = "1"
mlua = { version = "0.12", features = ["lua54", "vendored", "send", "async"] }

[dev-dependencies]
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "smallvec",
    "std",
    "tracing-log",
] }
proptest = { version = "1", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["test-util"] }
rmcp = { version = "3.1", default-features = false, features = ["client", "server"] }
