[package]
name = "phi-tui"
version = "0.0.1"
edition = "2024"
description = "Reusable terminal UI widgets and runtime for coding applications"
license = "MIT"
readme = "README.md"
repository = "https://codeberg.org/Vandee/phi"

[dependencies]
anyhow = "1"
crossterm = { version = "0.29", default-features = false, features = ["bracketed-paste", "events", "windows"] }
unicode-width = "0.2"
unicode-segmentation = "1.12"
textwrap = { version = "0.16", default-features = false, features = ["unicode-width", "unicode-linebreak"] }
pulldown-cmark = { version = "0.13", default-features = false }
ignore = "0.4"
nucleo-matcher = "0.3"
base64 = "0.23"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }

[dev-dependencies]
vt100 = "=0.16.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["termios"] }
