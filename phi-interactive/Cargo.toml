[package]
name = "phi-interactive"
version = "0.0.1"
edition = "2024"
license = "MIT"

[[bin]]
name = "phi"
path = "src/main.rs"

[dependencies]
phi-sdk = { path = "../phi-sdk" }
phi-remote = { path = "../phi-remote" }
phi-tui = { path = "../phi-tui" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
compact_str = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "process", "fs", "net", "io-util", "signal"] }
futures-util = "0.3"
filetime = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "env-filter",
    "fmt",
    "smallvec",
    "std",
    "tracing-log",
] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
crossterm = { version = "0.29", default-features = false, features = ["bracketed-paste", "events", "windows"] }
chrono = { version = "0.4", features = ["serde"] }
ignore = "0.4"
glob = "0.3"
open = "5.4"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio-tungstenite = "0.29"
ed25519-dalek = "2"
proptest = { version = "1", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(unix))'.dependencies]
same-file = "1"
